# desktop-ai 源码的 rlib-only 视图：与主 crate 编译同一份 src/lib.rs，
# 但不带 cdylib crate-type。cargo-fuzz 会用 -Zsanitizer=fuzzer 编译整
# 个依赖图，该开关让链接器对每个产物强制引用 libFuzzer 的 main 符号
# （/include:main）；cdylib 没有 main，链接必失败（LNK2001 无法解析
# 的外部符号 main）。Android 交付的 .so 仍由主 crate 的
# crate-type = ["rlib", "cdylib"] 照常产出，与本目录互不影响。
#
# 维护警示：下方 [dependencies] 三段抄自主包 Cargo.toml（版本串逐字
# 一致）。主包增删依赖时必须同步此处——不同步的后果是 fuzz 构建立刻
# 失败（E0432/E0433），错误显性、不会静默。
[package]
name = "desktop-ai-fuzz-host"
version = "0.0.0"
publish = false
edition = "2021"

[lib]
name = "desktop_ai"
path = "../../src/lib.rs"

[dependencies]
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
pulldown-cmark = "0.12"
libloading = "0.8"
once_cell = "1"
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
pdf-extract = "0.12"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
getrandom = "0.4.3"
tracing-appender = "0.2.5"

# 与主包一致：桌面文件对话框 / eframe 桌面外壳不进 Android；
# Android 的 JNI 桥在 desktop 构建下由 cfg(target_os) 排除。
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"
eframe = "0.31"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
