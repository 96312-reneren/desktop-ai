<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>桌面AI</title>
<style>
  :root {
    --bg: #0f1115; --bg2: #171a21; --bg3: #1e222b;
    --border: #262b36; --text: #e8eaed; --dim: #8b93a3;
    --accent: #3b82f6; --accent2: #2563eb; --user: #2563eb;
    --green: #22c55e; --red: #ef4444;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", "PingFang SC", sans-serif;
    background:var(--bg); color:var(--text); overflow:hidden;
  }
  button { font-family:inherit; }

  /* ---------- layout ---------- */
  #app { display:flex; height:100%; }
  #sidebar {
    width:280px; max-width:82%; background:var(--bg2); border-right:1px solid var(--border);
    display:flex; flex-direction:column; flex-shrink:0;
    position:fixed; top:0; bottom:0; left:0; z-index:20;
    transform:translateX(-100%); transition:transform .22s ease;
  }
  #app.side-open #sidebar { transform:translateX(0); }
  #app.side-open #scrim { display:block; }
  #scrim { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:15; }

  /* ---------- sidebar ---------- */
  .side-head { padding:14px 14px 10px; display:flex; align-items:center; justify-content:space-between; }
  .side-head .logo { font-size:16px; font-weight:700; letter-spacing:.5px; }
  .side-head .logo b { color:var(--accent); }
  .btn-new {
    background:var(--accent); color:#fff; border:none; border-radius:10px;
    padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .btn-new:active { background:var(--accent2); }
  #convList { flex:1; overflow-y:auto; padding:6px 10px 12px; }
  .conv {
    display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:10px;
    cursor:pointer; margin-bottom:2px;
  }
  .conv:active { background:var(--bg3); }
  .conv.active { background:var(--bg3); }
  .conv .icon { width:30px; height:30px; border-radius:8px; background:var(--bg3); display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
  .conv.active .icon { background:var(--accent); }
  .conv .meta { flex:1; min-width:0; }
  .conv .title { font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .conv .sub { font-size:11px; color:var(--dim); margin-top:2px; }
  .conv .del {
    background:none; border:none; color:var(--dim); font-size:15px; padding:4px 6px;
    border-radius:6px; cursor:pointer; visibility:hidden;
  }
  .conv.active .del { visibility:visible; }
  .conv .del:active { color:var(--red); }
  .side-empty { color:var(--dim); font-size:13px; text-align:center; padding:28px 10px; }

  /* ---------- main ---------- */
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  header {
    display:flex; align-items:center; gap:10px; padding:12px 14px;
    background:var(--bg2); border-bottom:1px solid var(--border); flex-shrink:0;
  }
  #btnMenu { background:none; border:none; color:var(--text); font-size:18px; padding:6px; cursor:pointer; }
  .h-title { flex:1; min-width:0; }
  .h-title .name { font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .h-status { font-size:11.5px; color:var(--dim); display:flex; align-items:center; gap:5px; margin-top:2px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); flex-shrink:0; }
  .dot.loading { background:var(--accent); animation:pulse 1.1s infinite; }
  .dot.ready { background:var(--green); }
  .dot.error { background:var(--red); }
  @keyframes pulse { 0%,100% {opacity:1;} 50% {opacity:.3;} }
  #btnNewTop { background:none; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 10px; font-size:12.5px; cursor:pointer; }

  /* ---------- messages ---------- */
  #msgs { flex:1; overflow-y:auto; padding:16px 14px 8px; overscroll-behavior:contain; }
  .msg { display:flex; gap:10px; margin-bottom:16px; }
  .msg .avatar {
    width:30px; height:30px; border-radius:8px; flex-shrink:0; display:flex;
    align-items:center; justify-content:center; font-size:13px; font-weight:700;
  }
  .msg.user { flex-direction:row-reverse; }
  .msg.user .avatar { background:var(--accent); }
  .msg.bot .avatar { background:var(--bg3); }
  .bubble {
    max-width:82%; padding:10px 13px; border-radius:14px; font-size:14.5px;
    line-height:1.6; word-break:break-word; white-space:pre-wrap;
  }
  .msg.user .bubble { background:var(--user); color:#fff; border-bottom-right-radius:4px; }
  .msg.bot .bubble { background:var(--bg3); border-bottom-left-radius:4px; }
  .msg.bot .think {
    color:var(--dim); font-style:italic; font-size:13px; white-space:pre-wrap;
    border-left:2px solid var(--border); padding-left:10px; margin-bottom:8px;
  }
  .bubble pre {
    background:#0a0c10; border:1px solid var(--border); border-radius:8px;
    padding:10px; overflow-x:auto; font-size:12.5px; margin:6px 0;
  }
  .bubble code { font-family:"SF Mono", Consolas, monospace; font-size:12.5px; }
  .bubble :not(pre) > code { background:var(--bg2); padding:1px 5px; border-radius:4px; }
  .bubble p { margin:4px 0; }
  .bubble ul, .bubble ol { padding-left:20px; margin:4px 0; }
  .bubble h1, .bubble h2, .bubble h3 { margin:8px 0 4px; font-size:15px; }
  .bubble table { border-collapse:collapse; margin:6px 0; font-size:13px; }
  .bubble th, .bubble td { border:1px solid var(--border); padding:4px 8px; }
  .bubble blockquote { border-left:3px solid var(--accent); padding-left:10px; color:var(--dim); margin:6px 0; }
  .bubble a { color:var(--accent); }
  .cursor { display:inline-block; width:8px; height:15px; background:var(--accent); vertical-align:-2px; animation:pulse 1s infinite; }
  .typing { display:flex; gap:4px; padding:4px 2px; }
  .typing span { width:6px; height:6px; border-radius:50%; background:var(--dim); animation:pulse 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay:.15s; } .typing span:nth-child(3){ animation-delay:.3s; }
  .empty-state { text-align:center; padding:18vh 20px 0; color:var(--dim); }
  .empty-state .big { font-size:40px; margin-bottom:14px; }
  .empty-state h2 { color:var(--text); font-size:17px; margin-bottom:8px; }
  .empty-state p { font-size:13px; line-height:1.7; }
  .empty-state .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:18px; }
  .chip { background:var(--bg3); border:1px solid var(--border); color:var(--text); border-radius:16px; padding:7px 13px; font-size:12.5px; cursor:pointer; }
  .chip:active { border-color:var(--accent); color:var(--accent); }

  /* ---------- input bar ---------- */
  #bar {
    padding:10px 12px calc(12px + env(safe-area-inset-bottom)); background:var(--bg2);
    border-top:1px solid var(--border); display:flex; align-items:flex-end; gap:8px; flex-shrink:0;
  }
  #input {
    flex:1; background:var(--bg3); border:1px solid var(--border); border-radius:20px;
    color:var(--text); font-size:15.5px; padding:11px 16px; outline:none;
    max-height:110px; min-height:44px; resize:none; line-height:1.4;
  }
  #input:focus { border-color:var(--accent); }
  #send {
    background:var(--accent); color:#fff; border:none; border-radius:22px;
    width:44px; height:44px; font-size:17px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  #send:active { background:var(--accent2); }
  #send:disabled { background:var(--bg3); color:var(--dim); }
</style>
</head>
<body>
<div id="app">
  <div id="scrim"></div>

  <!-- sidebar: conversation CRUD -->
  <aside id="sidebar">
    <div class="side-head">
      <div class="logo">桌面<b>AI</b></div>
      <button class="btn-new" id="btnNewSide">+ 新对话</button>
    </div>
    <div id="convList"></div>
  </aside>

  <!-- main -->
  <main id="main">
    <header>
      <button id="btnMenu">☰</button>
      <div class="h-title">
        <div class="name" id="hName">桌面AI</div>
        <div class="h-status"><span class="dot" id="hDot"></span><span id="hStatus">正在启动本地推理服务...</span></div>
      </div>
      <button id="btnNewTop">+ 新对话</button>
    </header>
    <div id="msgs"></div>
    <div id="bar">
      <textarea id="input" rows="1" placeholder="输入消息,Enter 发送"></textarea>
      <button id="send" disabled>➤</button>
    </div>
  </main>
</div>

<script>
"use strict";
const API = "http://127.0.0.1:11434/v1/chat/completions";
const READY_URL = "http://127.0.0.1:11434/ready";
const LS_KEY = "desktopai.convs.v1";
const SUGGESTIONS = ["用一句话介绍你自己", "讲个简短的笑话", "1+1等于几?", "写一首五言绝句"];

let ready = false, busy = false;
let convs = loadConvs(), activeId = null;

const $ = s => document.querySelector(s);
const app = $("#app"), msgsEl = $("#msgs"), input = $("#input"), send = $("#send");
const hDot = $("#hDot"), hStatus = $("#hStatus"), hName = $("#hName");

/* ---------- storage (会话 CRUD) ---------- */
function loadConvs() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return [];
}
function saveConvs() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(convs)); } catch (e) {}
}
function newConv() {
  const c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
              title: "新对话", createdAt: Date.now(), messages: [] };
  convs.unshift(c); saveConvs();
  return c;
}
function getConv() { return convs.find(c => c.id === activeId) || null; }
function deleteConv(id) {
  convs = convs.filter(c => c.id !== id); saveConvs();
  if (activeId === id) { activeId = null; openFirstConv(); }
  renderSidebar();
}
function renameConv(id, firstMsg) {
  const c = convs.find(c => c.id === id);
  if (c && c.title === "新对话") { c.title = firstMsg.length > 24 ? firstMsg.slice(0,24) + "…" : firstMsg; saveConvs(); }
}
function openFirstConv() {
  if (convs.length === 0) { newConv(); }
  activeId = convs[0].id;
}

/* ---------- sidebar render ---------- */
function renderSidebar() {
  const list = $("#convList");
  if (convs.length === 0) {
    list.innerHTML = '<div class="side-empty">还没有对话<br>点击"新对话"开始</div>';
    return;
  }
  list.innerHTML = "";
  for (const c of convs) {
    const row = document.createElement("div");
    row.className = "conv" + (c.id === activeId ? " active" : "");
    const last = c.messages[c.messages.length - 1];
    const sub = last ? (last.role === "user" ? "你: " : "AI: ") + last.content.replace(/\n/g," ").slice(0,20) : "空对话";
    const t = new Date(c.createdAt);
    const time = (t.getMonth()+1) + "/" + t.getDate();
    row.innerHTML =
      '<div class="icon">💬</div>' +
      '<div class="meta"><div class="title"></div><div class="sub"></div></div>' +
      '<button class="del">✕</button>';
    row.querySelector(".title").textContent = c.title;
    row.querySelector(".sub").textContent = sub;
    row.addEventListener("click", () => { activeId = c.id; closeSide(); renderAll(); });
    row.querySelector(".del").addEventListener("click", e => { e.stopPropagation(); deleteConv(c.id); });
    list.appendChild(row);
  }
  // no need to expose time separately; keep simple
}

/* ---------- sidebar open/close ---------- */
function openSide() { app.classList.add("side-open"); }
function closeSide() { app.classList.remove("side-open"); }
$("#btnMenu").onclick = openSide;
$("#scrim").onclick = closeSide;
$("#btnNewSide").onclick = () => { const c = newConv(); activeId = c.id; closeSide(); renderAll(); };
$("#btnNewTop").onclick = () => { const c = newConv(); activeId = c.id; renderAll(); };

/* ---------- message rendering ---------- */
function esc(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function renderMarkdown(text) {
  // lightweight markdown: code blocks, inline code, bold, italic, headings,
  // lists, tables are kept raw (pre-wrap). Enough for chat output.
  const blocks = text.split(/```/);
  let out = "", code = false;
  for (const b of blocks) {
    if (code) {
      let lang = "";
      let body = b;
      const nl = b.indexOf("\n");
      if (nl > 0 && nl < 20) { lang = b.slice(0, nl).trim(); body = b.slice(nl + 1); }
      out += "<pre><code>" + esc(body) + "</code></pre>";
    } else {
      out += esc(b)
        .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
        .replace(/\*([^*]+)\*/g, "<i>$1</i>")
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/^### (.*)$/gm, "<h3>$1</h3>")
        .replace(/^## (.*)$/gm, "<h3>$1</h3>")
        .replace(/^# (.*)$/gm, "<h3>$1</h3>")
        .replace(/^- (.*)$/gm, "<p>• $1</p>")
        .replace(/^\d+\. (.*)$/gm, "<p>$1</p>")
        .replace(/\n/g, "<br>");
    }
    code = !code;
  }
  return out;
}
function addMsgEl(role) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  wrap.innerHTML = '<div class="avatar"></div><div class="bubble"></div>';
  wrap.querySelector(".avatar").textContent = role === "user" ? "我" : "AI";
  msgsEl.appendChild(wrap);
  return wrap.querySelector(".bubble");
}
function renderBotContent(el, text) {
  const think = (text.match(/<think>([\s\S]*?)<\/think>/g) || []).join("");
  const rest = text.replace(/<think>[\s\S]*?<\/think>/g, "").trim();
  el.innerHTML = "";
  if (think) {
    const t = document.createElement("div");
    t.className = "think";
    t.textContent = think.replace(/<\/?think>/g, "");
    el.appendChild(t);
  }
  if (rest) {
    const div = document.createElement("div");
    div.innerHTML = renderMarkdown(rest);
    el.appendChild(div);
  }
}
function scrollBottom() { msgsEl.scrollTop = msgsEl.scrollHeight; }

/* ---------- full render ---------- */
function renderAll() {
  renderSidebar();
  const c = getConv();
  hName.textContent = c ? c.title : "桌面AI";
  msgsEl.innerHTML = "";
  if (c && c.messages.length > 0) {
    for (const m of c.messages) {
      const el = addMsgEl(m.role);
      if (m.role === "bot") renderBotContent(el, m.content);
      else el.textContent = m.content;
    }
    scrollBottom();
  } else {
    msgsEl.innerHTML =
      '<div class="empty-state">' +
        '<div class="big">🤖</div>' +
        '<h2>桌面AI · 完全离线</h2>' +
        '<p>本地大模型推理,数据不出手机<br>支持中英文对话</p>' +
        '<div class="chips"></div>' +
      '</div>';
    const chips = msgsEl.querySelector(".chips");
    for (const s of SUGGESTIONS) {
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.textContent = s;
      chip.onclick = () => { input.value = s; sendMessage(); };
      chips.appendChild(chip);
    }
  }
}

/* ---------- ready polling ---------- */
function setStatus(state, text) {
  hDot.className = "dot" + (state === "ready" ? " ready" : state === "loading" ? " loading" : state === "error" ? " error" : "");
  hStatus.textContent = text;
  if (state === "ready") { ready = true; send.disabled = busy; }
  else if (state === "loading") send.disabled = true;
}
async function checkReady() {
  try {
    const r = await fetch(READY_URL, { timeout: 4000 });
    if (r.ok) { setStatus("ready", "● 模型就绪 · 完全离线"); return; }
  } catch (e) {}
  setTimeout(checkReady, 1500);
}

/* ---------- send ---------- */
function sendMessage() {
  const text = input.value.trim();
  if (!text || !ready || busy) return;
  const c = getConv();
  if (!c) { renderAll(); return; }

  c.messages.push({ role: "user", content: text });
  renameConv(c.id, text);
  saveConvs();

  input.value = "";
  input.style.height = "44px";
  busy = true;
  send.disabled = true;

  renderAll();
  const botEl = addMsgEl("bot");
  botEl.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  scrollBottom();

  const history = c.messages.map(m => ({ role: m.role, content: m.content }));
  const payload = JSON.stringify({ model: "desktop-ai", stream: false, messages: history });

  if (window.AndroidBridge) {
    window.AndroidBridge.postJson(API, payload, "chat");
  } else {
    finishMessage(botEl, "(无法连接本地服务)");
  }
}
function finishMessage(botEl, text) {
  const c = getConv();
  if (c) {
    c.messages.push({ role: "assistant", content: text });
    saveConvs();
    renderSidebar();
  }
  renderBotContent(botEl, text);
  scrollBottom();
  busy = false;
  if (ready) send.disabled = false;
}
window.addEventListener("aiResp", e => {
  const bubbles = msgsEl.querySelectorAll(".msg.bot .bubble");
  const botEl = bubbles[bubbles.length - 1];
  if (!botEl) return;
  let text = e.detail;
  try {
    const j = JSON.parse(text);
    if (j.error) { finishMessage(botEl, "错误: " + j.error); return; }
    text = j.choices?.[0]?.message?.content ?? "(空回复)";
  } catch (err) {
    finishMessage(botEl, "解析失败: " + text.slice(0, 200));
    return;
  }
  finishMessage(botEl, text);
});

/* ---------- input behavior ---------- */
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
input.addEventListener("input", () => {
  input.style.height = "44px";
  input.style.height = Math.min(input.scrollHeight, 110) + "px";
});
send.onclick = sendMessage;

/* ---------- boot ---------- */
openFirstConv();
renderAll();
checkReady();
</script>
</body>
</html>
