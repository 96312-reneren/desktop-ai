<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#141218">
<title>桌面AI</title>
<style>
  /* ============ Material Design 3 — dark theme (purple baseline) ============ */
  :root {
    --primary: #D0BCFF;
    --on-primary: #381E72;
    --primary-container: #4F378B;
    --on-primary-container: #EADDFF;
    --secondary-container: #4A4458;
    --on-secondary-container: #E8DEF8;
    --tertiary-container: #633B48;
    --on-tertiary-container: #FFD8E4;
    --surface: #141218;
    --surface-container-lowest: #0F0D13;
    --surface-container-low: #1D1B20;
    --surface-container: #211F26;
    --surface-container-high: #2B2930;
    --surface-container-highest: #36343B;
    --on-surface: #E6E0E9;
    --on-surface-variant: #CAC4D0;
    --outline: #938F99;
    --outline-variant: #49454F;
    --error: #F2B8B5;
    --on-error-container: #F9DEDC;
    --error-container: #8C1D18;
    --success: #B6CCB2;
    --scrim: rgba(0, 0, 0, .55);
    /* shape scale */
    --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
    --r-xl: 20px; --r-2xl: 24px; --r-full: 999px;
    /* motion */
    --ease: cubic-bezier(.2, 0, 0, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: Roboto, "Noto Sans CJK SC", "PingFang SC", -apple-system, sans-serif;
    background: var(--surface); color: var(--on-surface);
    overflow: hidden; -webkit-font-smoothing: antialiased;
    font-size: 14px; line-height: 1.5;
  }
  button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }

  /* ============ layout ============ */
  #app { display: flex; height: 100%; position: relative; }

  /* ============ navigation drawer ============ */
  #scrim {
    position: fixed; inset: 0; background: var(--scrim); z-index: 15;
    opacity: 0; pointer-events: none; transition: opacity .25s var(--ease);
  }
  #app.side-open #scrim { opacity: 1; pointer-events: auto; }
  #sidebar {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 20;
    width: 300px; max-width: 84%;
    background: var(--surface-container-low);
    border-top-right-radius: var(--r-lg); border-bottom-right-radius: var(--r-lg);
    display: flex; flex-direction: column;
    transform: translateX(-105%); transition: transform .3s var(--ease);
    box-shadow: 0 0 24px rgba(0,0,0,.4);
  }
  #app.side-open #sidebar { transform: translateX(0); }

  .drawer-head { padding: 20px 16px 8px; display: flex; align-items: center; justify-content: space-between; }
  .drawer-title { font-size: 22px; font-weight: 500; letter-spacing: .2px; color: var(--on-surface); }
  .drawer-title b { color: var(--primary); font-weight: 600; }

  .btn-new {
    display: flex; align-items: center; gap: 10px;
    margin: 8px 12px 4px; padding: 14px 16px;
    background: var(--primary-container); color: var(--on-primary-container);
    border-radius: var(--r-lg); font-size: 14px; font-weight: 500;
    transition: box-shadow .2s var(--ease), transform .1s var(--ease);
  }
  .btn-new:active { transform: scale(.98); box-shadow: 0 0 12px rgba(208,188,255,.25); }
  .btn-new svg { width: 20px; height: 20px; }

  #convList { flex: 1; overflow-y: auto; padding: 8px 12px 16px; }
  .conv {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: var(--r-full);
    cursor: pointer; margin-bottom: 4px;
    transition: background .15s var(--ease);
    position: relative;
  }
  .conv:active { background: var(--surface-container-high); }
  .conv.active { background: var(--secondary-container); color: var(--on-secondary-container); }
  .conv .icon {
    width: 24px; height: 24px; flex-shrink: 0;
    color: var(--on-surface-variant);
  }
  .conv.active .icon { color: var(--on-secondary-container); }
  .conv .icon svg { width: 24px; height: 24px; }
  .conv .meta { flex: 1; min-width: 0; }
  .conv .title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv .sub { font-size: 12px; color: var(--on-surface-variant); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv.active .sub { color: var(--on-secondary-container); opacity: .8; }
  .conv .del {
    width: 36px; height: 36px; border-radius: var(--r-full);
    display: flex; align-items: center; justify-content: center;
    color: var(--on-surface-variant); opacity: 0; transition: opacity .15s var(--ease);
  }
  .conv.active .del { opacity: 1; }
  .conv .del svg { width: 18px; height: 18px; }
  .side-empty {
    text-align: center; color: var(--on-surface-variant); font-size: 13px;
    padding: 40px 20px; line-height: 1.8;
  }
  .side-empty svg { width: 40px; height: 40px; opacity: .5; margin-bottom: 12px; }

  /* ============ top app bar ============ */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    display: flex; align-items: center; gap: 4px;
    padding: 8px 8px; background: var(--surface);
    flex-shrink: 0; position: relative; z-index: 5;
  }
  .icon-btn {
    width: 48px; height: 48px; border-radius: var(--r-full);
    display: flex; align-items: center; justify-content: center;
    color: var(--on-surface-variant); flex-shrink: 0;
    transition: background .15s var(--ease);
  }
  .icon-btn:active { background: var(--surface-container-high); }
  .icon-btn svg { width: 22px; height: 22px; }
  .h-title { flex: 1; min-width: 0; margin-left: 4px; }
  .h-title .name {
    font-size: 16px; font-weight: 500; color: var(--on-surface);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .h-status { font-size: 12px; color: var(--on-surface-variant); display: flex; align-items: center; gap: 6px; margin-top: 1px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--outline); flex-shrink: 0; transition: background .3s; }
  .dot.loading { background: var(--primary); animation: pulse 1.2s infinite; }
  .dot.ready { background: var(--success); }
  .dot.error { background: var(--error); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  /* ============ messages ============ */
  #msgs { flex: 1; overflow-y: auto; padding: 12px 12px 4px; overscroll-behavior: contain; }
  .msg { display: flex; gap: 8px; margin-bottom: 14px; animation: msg-in .25s var(--ease); }
  @keyframes msg-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .msg .avatar {
    width: 32px; height: 32px; border-radius: var(--r-full); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .msg .avatar svg { width: 18px; height: 18px; }
  .msg.bot .avatar { background: var(--primary-container); color: var(--on-primary-container); }
  .msg.user .avatar { background: var(--tertiary-container); color: var(--on-tertiary-container); }
  .msg.user { flex-direction: row-reverse; }
  .bubble {
    max-width: 80%; padding: 10px 14px; font-size: 14.5px; line-height: 1.6;
    word-break: break-word; white-space: pre-wrap;
  }
  .msg.user .bubble {
    background: var(--primary); color: var(--on-primary);
    border-radius: var(--r-xl) var(--r-xs) var(--r-xl) var(--r-xl);
  }
  .msg.bot .bubble {
    background: var(--surface-container-high); color: var(--on-surface);
    border-radius: var(--r-xs) var(--r-xl) var(--r-xl) var(--r-xl);
  }
  .msg.bot .think {
    color: var(--on-surface-variant); font-size: 13px; white-space: pre-wrap;
    border-left: 3px solid var(--outline-variant);
    padding-left: 10px; margin-bottom: 8px; border-radius: 2px;
  }
  .bubble pre {
    background: var(--surface-container-lowest); border: 1px solid var(--outline-variant);
    border-radius: var(--r-sm); padding: 10px; overflow-x: auto; font-size: 12.5px; margin: 6px 0;
  }
  .bubble code { font-family: "Roboto Mono", "SF Mono", Consolas, monospace; font-size: 12.5px; }
  .bubble :not(pre) > code {
    background: var(--surface-container-lowest); padding: 1px 6px; border-radius: var(--r-xs);
  }
  .bubble p { margin: 4px 0; }
  .bubble ul, .bubble ol { padding-left: 20px; margin: 4px 0; }
  .bubble h1, .bubble h2, .bubble h3 { margin: 10px 0 4px; font-size: 15px; font-weight: 600; }
  .bubble table { border-collapse: collapse; margin: 6px 0; font-size: 13px; }
  .bubble th, .bubble td { border: 1px solid var(--outline-variant); padding: 4px 10px; }
  .bubble blockquote { border-left: 3px solid var(--primary); padding-left: 10px; color: var(--on-surface-variant); margin: 6px 0; }
  .bubble a { color: var(--primary); }
  .typing { display: flex; gap: 5px; padding: 6px 2px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--on-surface-variant); animation: pulse 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }

  /* ============ empty state ============ */
  .empty-state { text-align: center; padding: 14vh 24px 0; }
  .empty-state .logo-circle {
    width: 80px; height: 80px; border-radius: var(--r-2xl);
    background: var(--primary-container); color: var(--on-primary-container);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .empty-state .logo-circle svg { width: 40px; height: 40px; }
  .empty-state h2 { font-size: 21px; font-weight: 500; margin-bottom: 8px; }
  .empty-state p { font-size: 13.5px; color: var(--on-surface-variant); line-height: 1.7; }
  .empty-state .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 24px; }
  .chip {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid var(--outline); border-radius: var(--r-sm);
    padding: 8px 16px; font-size: 13px; font-weight: 500;
    color: var(--on-surface-variant); background: none;
    transition: background .15s var(--ease);
  }
  .chip:active { background: var(--surface-container-high); }
  .chip svg { width: 16px; height: 16px; }

  /* ============ input bar ============ */
  #bar {
    padding: 8px 12px calc(12px + env(safe-area-inset-bottom));
    background: var(--surface); display: flex; align-items: flex-end; gap: 8px; flex-shrink: 0;
  }
  .input-wrap {
    flex: 1; display: flex; align-items: flex-end;
    background: var(--surface-container-highest);
    border: 1px solid var(--outline-variant);
    border-radius: var(--r-2xl);
    padding: 4px 6px 4px 16px;
    transition: border-color .2s var(--ease);
  }
  .input-wrap:focus-within { border-color: var(--primary); }
  #input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--on-surface); font-size: 15px; font-family: inherit;
    padding: 10px 0; max-height: 108px; min-height: 24px;
    resize: none; line-height: 1.45;
  }
  #input::placeholder { color: var(--on-surface-variant); }
  #send {
    width: 44px; height: 44px; border-radius: var(--r-full); flex-shrink: 0;
    background: var(--primary); color: var(--on-primary);
    display: flex; align-items: center; justify-content: center;
    transition: background .2s var(--ease), transform .1s var(--ease);
  }
  #send:active { transform: scale(.94); }
  #send:disabled { background: var(--surface-container-highest); color: var(--on-surface-variant); }
  #send svg { width: 20px; height: 20px; }

  /* scrollbar (desktop-ish WebView) */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--outline-variant); border-radius: 3px; }
</style>
</head>
<body>
<div id="app">
  <div id="scrim"></div>

  <!-- Navigation drawer -->
  <aside id="sidebar">
    <div class="drawer-head">
      <div class="drawer-title">桌面<b>AI</b></div>
    </div>
    <button class="btn-new" id="btnNewSide">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      新对话
    </button>
    <div id="convList"></div>
  </aside>

  <!-- Main -->
  <main id="main">
    <header>
      <button class="icon-btn" id="btnMenu" aria-label="菜单">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <div class="h-title">
        <div class="name" id="hName">桌面AI</div>
        <div class="h-status"><span class="dot" id="hDot"></span><span id="hStatus">正在启动本地推理服务...</span></div>
      </div>
      <button class="icon-btn" id="btnNewTop" aria-label="新对话">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>
    </header>
    <div id="msgs"></div>
    <div id="bar">
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="输入消息"></textarea>
      </div>
      <button id="send" disabled aria-label="发送">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </main>
</div>

<script>
"use strict";
const ICONS = {
  chat: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/></svg>',
  delete: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>',
  bot: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2zM7.5 13a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm9 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg>',
  person: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/></svg>'
};

// Port is allocated by Rust at runtime; the Kotlin bridge reports it.
const API_PORT = (window.AndroidBridge && parseInt(window.AndroidBridge.getApiPort(), 10)) || 11434;
const API = "http://127.0.0.1:" + API_PORT + "/v1/chat/completions";
const READY_URL = "http://127.0.0.1:" + API_PORT + "/ready";
const LS_KEY = "desktopai.convs.v1";
const SUGGESTIONS = ["用一句话介绍你自己", "讲个简短的笑话", "1+1等于几?", "写一首五言绝句"];

/* light obfuscation so plaintext conversations are not readable in backups */
function obf(s) {
  return btoa(unescape(encodeURIComponent(s)).split("").map((c) =>
    String.fromCharCode(c.charCodeAt(0) ^ 0x5a)).join(""));
}
function deobf(s) {
  try {
    return decodeURIComponent(escape(atob(s).split("").map((c) =>
      String.fromCharCode(c.charCodeAt(0) ^ 0x5a)).join("")));
  } catch (e) { return ""; }
}

let ready = false, busy = false;
let convs = loadConvs(), activeId = null;

const $ = s => document.querySelector(s);
const app = $("#app"), msgsEl = $("#msgs"), input = $("#input"), send = $("#send");
const hDot = $("#hDot"), hStatus = $("#hStatus"), hName = $("#hName");

/* ---------- storage (会话 CRUD) ---------- */
function loadConvs() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const dec = deobf(raw);
      if (dec) return JSON.parse(dec);
    }
  } catch (e) {}
  return [];
}
function saveConvs() {
  try { localStorage.setItem(LS_KEY, obf(JSON.stringify(convs))); } catch (e) {}
}
function newConv() {
  const c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
              title: "新对话", createdAt: Date.now(), messages: [] };
  convs.unshift(c); saveConvs();
  return c;
}
function getConv() { return convs.find(c => c.id === activeId) || null; }
function deleteConv(id) {
  convs = convs.filter(c => c.id !== id); saveConvs();
  if (activeId === id) { activeId = null; openFirstConv(); }
  renderSidebar();
}
function renameConv(id, firstMsg) {
  const c = convs.find(c => c.id === id);
  if (c && c.title === "新对话") {
    c.title = firstMsg.length > 24 ? firstMsg.slice(0,24) + "…" : firstMsg;
    saveConvs();
  }
}
function openFirstConv() {
  if (convs.length === 0) { newConv(); }
  activeId = convs[0].id;
}

/* ---------- sidebar render ---------- */
function renderSidebar() {
  const list = $("#convList");
  if (convs.length === 0) {
    list.innerHTML = '<div class="side-empty">' + ICONS.chat + '<br>还没有对话<br>点击"新对话"开始</div>';
    return;
  }
  list.innerHTML = "";
  for (const c of convs) {
    const row = document.createElement("div");
    row.className = "conv" + (c.id === activeId ? " active" : "");
    const last = c.messages[c.messages.length - 1];
    const sub = last ? (last.role === "user" ? "你: " : "AI: ") + last.content.replace(/\n/g," ").slice(0,20) : "空对话";
    row.innerHTML =
      '<div class="icon">' + ICONS.chat + '</div>' +
      '<div class="meta"><div class="title"></div><div class="sub"></div></div>' +
      '<button class="del">' + ICONS.delete + '</button>';
    row.querySelector(".title").textContent = c.title;
    row.querySelector(".sub").textContent = sub;
    row.addEventListener("click", () => { activeId = c.id; closeSide(); renderAll(); });
    row.querySelector(".del").addEventListener("click", e => { e.stopPropagation(); deleteConv(c.id); });
    list.appendChild(row);
  }
}

/* ---------- drawer ---------- */
function openSide() { app.classList.add("side-open"); }
function closeSide() { app.classList.remove("side-open"); }
$("#btnMenu").onclick = openSide;
$("#scrim").onclick = closeSide;
$("#btnNewSide").onclick = () => { const c = newConv(); activeId = c.id; closeSide(); renderAll(); };
$("#btnNewTop").onclick = () => { const c = newConv(); activeId = c.id; renderAll(); };

/* ---------- message rendering ---------- */
function esc(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function renderMarkdown(text) {
  const blocks = text.split(/```/);
  let out = "", code = false;
  for (const b of blocks) {
    if (code) {
      let body = b;
      const nl = b.indexOf("\n");
      if (nl > 0 && nl < 20) { body = b.slice(nl + 1); }
      out += "<pre><code>" + esc(body) + "</code></pre>";
    } else {
      out += esc(b)
        .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
        .replace(/\*([^*]+)\*/g, "<i>$1</i>")
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/^### (.*)$/gm, "<h3>$1</h3>")
        .replace(/^## (.*)$/gm, "<h3>$1</h3>")
        .replace(/^# (.*)$/gm, "<h3>$1</h3>")
        .replace(/^- (.*)$/gm, "<p>• $1</p>")
        .replace(/^\d+\. (.*)$/gm, "<p>$1</p>")
        .replace(/\n/g, "<br>");
    }
    code = !code;
  }
  return out;
}
function addMsgEl(role) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  wrap.innerHTML = '<div class="avatar">' +
    (role === "user" ? ICONS.person : ICONS.bot) + '</div><div class="bubble"></div>';
  msgsEl.appendChild(wrap);
  return wrap.querySelector(".bubble");
}
function renderBotContent(el, text) {
  const think = (text.match(/<think>([\s\S]*?)<\/think>/g) || []).join("");
  const rest = text.replace(/<think>[\s\S]*?<\/think>/g, "").trim();
  el.innerHTML = "";
  if (think) {
    const t = document.createElement("div");
    t.className = "think";
    t.textContent = think.replace(/<\/?think>/g, "");
    el.appendChild(t);
  }
  if (rest) {
    const div = document.createElement("div");
    div.innerHTML = renderMarkdown(rest);
    el.appendChild(div);
  }
}
function scrollBottom() { msgsEl.scrollTop = msgsEl.scrollHeight; }

/* ---------- full render ---------- */
function renderAll() {
  renderSidebar();
  const c = getConv();
  hName.textContent = c ? c.title : "桌面AI";
  msgsEl.innerHTML = "";
  if (c && c.messages.length > 0) {
    for (const m of c.messages) {
      const el = addMsgEl(m.role);
      if (m.role === "bot") renderBotContent(el, m.content);
      else el.textContent = m.content;
    }
    scrollBottom();
  } else {
    msgsEl.innerHTML =
      '<div class="empty-state">' +
        '<div class="logo-circle">' + ICONS.spark + '</div>' +
        '<h2>桌面AI · 完全离线</h2>' +
        '<p>本地大模型推理,数据不出手机<br>支持中英文对话</p>' +
        '<div class="chips"></div>' +
      '</div>';
    const chips = msgsEl.querySelector(".chips");
    for (const s of SUGGESTIONS) {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = s;
      chip.onclick = () => { input.value = s; sendMessage(); };
      chips.appendChild(chip);
    }
  }
}

/* ---------- status ---------- */
function setStatus(state, text) {
  hDot.className = "dot" + (state === "ready" ? " ready" : state === "loading" ? " loading" : state === "error" ? " error" : "");
  hStatus.textContent = text;
  if (state === "ready") { ready = true; send.disabled = busy; }
  else if (state === "loading") send.disabled = true;
}
async function checkReady() {
  try {
    const r = await fetch(READY_URL, { timeout: 4000 });
    if (r.ok) { setStatus("ready", "模型就绪 · 完全离线"); return; }
  } catch (e) {}
  setTimeout(checkReady, 1500);
}

/* ---------- send ---------- */
function sendMessage() {
  const text = input.value.trim();
  if (!text || !ready || busy) return;
  const c = getConv();
  if (!c) { renderAll(); return; }

  c.messages.push({ role: "user", content: text });
  renameConv(c.id, text);
  saveConvs();

  input.value = "";
  input.style.height = "24px";
  busy = true;
  send.disabled = true;

  renderAll();
  const botEl = addMsgEl("bot");
  botEl.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  scrollBottom();

  const history = c.messages.map(m => ({ role: m.role, content: m.content }));
  const payload = JSON.stringify({ model: "desktop-ai", stream: false, messages: history });

  if (window.AndroidBridge) {
    window.AndroidBridge.postJson(API, payload, "chat");
  } else {
    finishMessage(botEl, "(无法连接本地服务)");
  }
}
function finishMessage(botEl, text) {
  const c = getConv();
  if (c) {
    c.messages.push({ role: "assistant", content: text });
    saveConvs();
    renderSidebar();
  }
  renderBotContent(botEl, text);
  scrollBottom();
  busy = false;
  if (ready) send.disabled = false;
}
window.addEventListener("aiResp", e => {
  const bubbles = msgsEl.querySelectorAll(".msg.bot .bubble");
  const botEl = bubbles[bubbles.length - 1];
  if (!botEl) return;
  let text = e.detail;
  try {
    const j = JSON.parse(text);
    if (j.error) { finishMessage(botEl, "错误: " + j.error); return; }
    text = j.choices?.[0]?.message?.content ?? "(空回复)";
  } catch (err) {
    finishMessage(botEl, "解析失败: " + text.slice(0, 200));
    return;
  }
  finishMessage(botEl, text);
});

/* ---------- input behavior ---------- */
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
input.addEventListener("input", () => {
  input.style.height = "24px";
  input.style.height = Math.min(input.scrollHeight, 108) + "px";
});
send.onclick = sendMessage;

/* ---------- boot ---------- */
openFirstConv();
renderAll();
checkReady();
</script>
</body>
</html>
