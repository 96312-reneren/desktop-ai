name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-ai
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # RUSTSEC-2026-0194/0195 (quick-xml): no fixable upgrade — quick-xml 0.30
      # is locked by wayland-scanner (build-time tool, never runs on Windows CI)
      # and 0.39 by zbus_xml (system D-Bus XML parsing, local attack surface
      # only). Tracked upstream; revisit when new versions release.
      - run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

  # The desktop app ships for Linux too; catch platform breakage on every push
  # (previously only the release workflow built for Linux, i.e. on tags).
  linux-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-ai
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake pkg-config \
            libssl-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libgtk-3-dev \
            libgl1-mesa-dev
      - run: cargo check --all-targets

  # The Android target is the third platform and had zero CI coverage; a
  # cross cargo check catches "desktop change broke Android" early.
  android-check:
    name: Android (cross cargo check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-ai
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      # The ubuntu-latest image ships the Android SDK; install the NDK via
      # sdkmanager directly (the android-actions/setup-android action was
      # failing on this runner).
      - name: Install NDK
        run: |
          SDK=/usr/local/lib/android/sdk
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653" > /dev/null
      - name: Pin the cross C toolchain (for ring / bundled sqlite)
        run: |
          NDK_BIN="/usr/local/lib/android/sdk/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64-linux-android=$NDK_BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64-linux-android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
      - run: cargo check --target aarch64-linux-android
