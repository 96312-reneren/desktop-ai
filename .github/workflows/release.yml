name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号 (如 6.1.0)，留空则读取 Cargo.toml"
        required: false
        default: ""

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-ai
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Assemble package
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item target/release/desktop-ai.exe staging/桌面AI.exe
          # Vendor runtimes live in <repo>/vendor/windows (outside the crate
          # dir, hence the absolute path); llama.dll hard-depends on the
          # ggml/libstdc++/libgcc/libwinpthread/libgomp set, so the whole
          # set must ship (the old workflow copied only llama.dll and produced
          # an unusable package).
          Copy-Item "$env:GITHUB_WORKSPACE/vendor/windows/*.dll" staging/
          Compress-Archive -Path staging/* -DestinationPath 桌面AI-v$ver-windows-x86_64.zip -Force
        env:
          APP_VERSION: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: desktop-ai/桌面AI-*.zip

  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-ai
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake pkg-config patchelf \
            libssl-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libgtk-3-dev \
            libgl1-mesa-dev
      - name: Build libllama.so (llama.cpp b7700)
        run: |
          git clone --depth 1 --branch b7700 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cd /tmp/llama.cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_CURL=OFF
          cmake --build build -j$(nproc)
          # Self-contained: resolve ggml deps relative to libllama.so
          patchelf --set-rpath '$ORIGIN' build/bin/libllama.so.0 \
            build/bin/libggml.so.0 build/bin/libggml-cpu.so.0 build/bin/libggml-base.so.0
          # Vendor into the repo layout so build.rs picks them up. NOTE: cwd
          # here is /tmp/llama.cpp, so use the absolute workspace path.
          mkdir -p "$GITHUB_WORKSPACE/vendor/linux"
          cp -f build/bin/libllama.so.0 "$GITHUB_WORKSPACE/vendor/linux/libllama.so"
          cp -f build/bin/libggml.so.0 "$GITHUB_WORKSPACE/vendor/linux/libggml.so.0"
          cp -f build/bin/libggml-cpu.so.0 "$GITHUB_WORKSPACE/vendor/linux/libggml-cpu.so.0"
          cp -f build/bin/libggml-base.so.0 "$GITHUB_WORKSPACE/vendor/linux/libggml-base.so.0"
      - run: cargo build --release
      - name: Assemble package
        run: |
          mkdir -p staging
          cp -f target/release/desktop-ai staging/
          cp -f "$GITHUB_WORKSPACE/vendor/linux/libllama.so" \
            "$GITHUB_WORKSPACE/vendor/linux/libggml.so.0" \
            "$GITHUB_WORKSPACE/vendor/linux/libggml-cpu.so.0" \
            "$GITHUB_WORKSPACE/vendor/linux/libggml-base.so.0" staging/
          tar czf ../desktop-ai-${{ github.ref_name }}-linux-x86_64.tar.gz staging
        working-directory: desktop-ai
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: desktop-ai-*.tar.gz

  release:
    name: Publish GitHub Release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            ## 桌面AI ${{ github.ref_name }}

            完整变更见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。

            ### 安装
            - **Windows**:解压 `windows-x86_64` 压缩包,运行 `桌面AI.exe`(与 `llama.dll` 放同一目录)
            - **Linux**:解压 `linux-x86_64` tar.gz,运行 `desktop-ai`(需 glibc ≥ 2.35)

            ### 命令行服务(可选)
            ```
            桌面AI.exe serve --port 8321
            ```
            v6.3.0 起可无界面启动本地模型与 OpenAI 兼容 API;`--help` 查看全部参数。
